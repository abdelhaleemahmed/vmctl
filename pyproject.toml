[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmctl"
# Single-sourced from vmctl/__init__.py; see [tool.setuptools.dynamic] below.
# Both files used to hardcode it and scripts/release.sh sed-patched each (H-03).
dynamic = ["version"]
description = "Manage VMs as configuration files on VirtualBox, libvirt/QEMU, plain QEMU and VMware"
readme = "README.md"
# 3.13 because the support window is what matters for a tool people install once
# and keep: 3.13 has security support to October 2029, and CI also runs 3.14
# (October 2030) so this does not go stale unnoticed. Everything below was either
# end-of-life or within a month of it, and the last three of 3.8's own defects
# were only visible because 3.8 was still declared here.
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Ahmed Abdelhaleem Ahmed", email = "ahmedhal@gmail.com"}
]
classifiers = [
    # 2.0.0: four providers, a conformance suite they all pass, and every capability
    # table measured against the running product rather than written from documentation.
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = [
    "virtualbox",
    "libvirt",
    "qemu",
    "vmware",
    "vm",
    "virtual-machine",
    "management",
    "automation",
    "devops",
    "infrastructure",
]

dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned below the next style year on purpose. black reformats on a yearly
    # cadence, so an open upper bound means a release nobody made can fail CI and
    # leave the repository formatted differently from every checkout -- which is
    # what happened: black 26 wanted 15 files changed. The 3.10 floor it needs is
    # no longer the obstacle; the churn is. Raise this deliberately, with the
    # reformatting as its own commit and nothing else in it.
    "black>=25.0,<26",
    "flake8>=5.0",
    "mypy>=0.991",
    "types-PyYAML",
    # Checks that `vmctl schema` emits a valid schema, and that the committed copy
    # still describes the model (E-06). Not needed to run vmctl.
    "jsonschema>=4.0",
    "build",
    "twine",
]
docs = [
    "sphinx>=7.0",
    "sphinx-click>=5.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://abdelhaleemahmed.github.io/vmctl/"
Repository = "https://github.com/abdelhaleemahmed/vmctl"
Documentation = "https://abdelhaleemahmed.github.io/vmctl/"
Changelog = "https://github.com/abdelhaleemahmed/vmctl/blob/main/CHANGELOG.md"
Issues = "https://github.com/abdelhaleemahmed/vmctl/issues"

[project.scripts]
vmctl = "vmctl.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "vmctl.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "venv", "venv.*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "allow_subprocess: test may call subprocess.run (must still not need a hypervisor)",
    "documents_bug: pins current buggy behaviour; flips when the referenced finding is fixed",
]
filterwarnings = ["error::DeprecationWarning:vmctl.*"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
# The floor, so mypy judges the code by the Python it actually has to run on.
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
