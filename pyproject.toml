[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmctl"
# Single-sourced from vmctl/__init__.py; see [tool.setuptools.dynamic] below.
# Both files used to hardcode it and scripts/release.sh sed-patched each (H-03).
dynamic = ["version"]
description = "Manage VMs as configuration files on VirtualBox, libvirt/QEMU, plain QEMU and VMware"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Ahmed Abdelhaleem Ahmed", email = "ahmedhal@gmail.com"}
]
classifiers = [
    # 2.0.0: four providers, a conformance suite they all pass, and every capability
    # table measured against the running product rather than written from documentation.
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = [
    "virtualbox",
    "libvirt",
    "qemu",
    "vmware",
    "vm",
    "virtual-machine",
    "management",
    "automation",
    "devops",
    "infrastructure",
]

dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.991",
    "types-PyYAML",
    # Checks that `vmctl schema` emits a valid schema, and that the committed copy
    # still describes the model (E-06). Not needed to run vmctl.
    "jsonschema>=4.0",
    "build",
    "twine",
]
docs = [
    "sphinx>=7.0",
    "sphinx-click>=5.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://abdelhaleemahmed.github.io/vmctl/"
Repository = "https://github.com/abdelhaleemahmed/vmctl"
Documentation = "https://abdelhaleemahmed.github.io/vmctl/"
Changelog = "https://github.com/abdelhaleemahmed/vmctl/blob/main/CHANGELOG.md"
Issues = "https://github.com/abdelhaleemahmed/vmctl/issues"

[project.scripts]
vmctl = "vmctl.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "vmctl.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "venv", "venv.*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "allow_subprocess: test may call subprocess.run (must still not need a hypervisor)",
    "documents_bug: pins current buggy behaviour; flips when the referenced finding is fixed",
]
filterwarnings = ["error::DeprecationWarning:vmctl.*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
# The package supports 3.8 at runtime (CI runs the tests there), but modern mypy
# will not target anything below 3.9, so type-check against 3.9.
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
