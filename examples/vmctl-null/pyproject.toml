[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vmctl-null"
version = "0.1.0"
description = "A third-party vmctl provider, used to check the plugin contract"
requires-python = ">=3.9"

[project.entry-points."vmctl.providers"]
null = "vmctl_null.backend:NullBackend"

[tool.setuptools]
packages = ["vmctl_null"]
