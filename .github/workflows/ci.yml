name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Nothing here needs a hypervisor: the test suite runs against captured
# VBoxManage output, and every example is checked in dry-run mode.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    # 22.04 because actions/setup-python no longer ships 3.8 for 24.04, and
    # pyproject still declares support for it.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      # Named separately so a failure here is obvious: it means a provider does
      # not satisfy the contract every provider must satisfy (A-07).
      - name: Provider conformance
        run: python -m pytest tests/conformance -q

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: black
        run: python -m black --check --diff vmctl/ tests/
      - name: flake8
        run: python -m flake8 vmctl/ tests/
      - name: mypy
        run: python -m mypy vmctl/

  examples:
    name: documented examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      # The README's own example config could not be imported at all before
      # v1.2.0. Checking it here is what stops the documentation drifting from
      # the code again (H-06).
      - name: Validate the single-VM example
        run: vmctl validate examples/ubuntu-server.yaml
      - name: Plan the single-VM example (dry-run)
        run: vmctl import examples/ubuntu-server.yaml --new-name ci-check
      - name: Plan the batch example (dry-run)
        run: vmctl batch create examples/lab-cluster.yaml
      - name: Generated batch template must be valid input
        run: |
          vmctl batch template -o /tmp/template.yaml
          vmctl batch create /tmp/template.yaml
      # The committed schema is what a user's editor validates against, so a model
      # change that does not regenerate it leaves them checking a tool that no
      # longer exists (E-06). The suite asserts this too; here it is visible.
      - name: The committed schema must still describe the model
        run: |
          vmctl schema -o /tmp/vmctl.schema.json
          diff -u vmctl.schema.json /tmp/vmctl.schema.json
      # Same argument for the generated tables (E-18): docs/features.md drifted for
      # months while it was maintained by hand, describing fields the model no longer
      # had and missing the ones it did.
      - name: The generated documentation must still match the code
        run: |
          python scripts/generate-docs.py
          git diff --exit-code docs/features.md docs/providers.md docs/commands.md

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build English docs
        run: python -m sphinx -b html -W --keep-going docs/sphinx docs/sphinx/_build/html
      - name: Build Arabic docs
        run: python -m sphinx -b html -W --keep-going docs/sphinx-ar docs/sphinx-ar/_build/html

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      # The version is single-sourced from vmctl/__init__.py (H-03); this proves
      # the dynamic lookup actually resolves in a built artifact.
      - name: Installed version matches the package
        run: |
          python -m pip install dist/*.whl
          expected=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vmctl/__init__.py)
          actual=$(vmctl --version | awk '{print $NF}')
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"
